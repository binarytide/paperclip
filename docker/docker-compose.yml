  #     - pgdata:/var/lib/postgresql/data

  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: paperclip
    labels:
      docktail.service.enable: "true"
      docktail.service.name: paperclip-docktail
      docktail.service.description: Paperclip web interface and API
      docktail.service.port: "3100"
    restart: unless-stopped
    # ports:
    #   - "3100:3100"
    environment:
      DATABASE_URL": "${DATABASE_URL:-postgresql://paperclip:paperclip@db:5432/paperclip}"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://paperclip:3100}"
      # bun -e "console.log(Buffer.from(crypto.getRandomValues(new Uint8Array(32))).toString('hex'))"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - paperclip-data:/paperclip
      - /Users/richardmcandrews/.codex:/paperclip/.codex
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

volumes:
  paperclip-data:
